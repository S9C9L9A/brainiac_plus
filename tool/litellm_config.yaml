# LiteLLM proxy — instrada i nomi-modello Anthropic sull'LLM locale.
#
# Backend REALE e stabile: container Docker `llamacpp` (llama.cpp ROCm) che serve
# Mistral-Small-24B su GPU R9700, API OpenAI-compatibile su http://localhost:8080/v1.
# Avvialo con: ./scripts/local-llm.sh start
#
# NB: le vecchie voci puntavano a Ollama (:11434) che è SPENTO. Ricablate su llama.cpp.
# Per usare questo proxy: `pip install litellm[proxy]` poi
#   litellm --config tool/litellm_config.yaml
# quindi in Claude Code: ANTHROPIC_BASE_URL=http://localhost:4000, ANTHROPIC_API_KEY=sk-brainiac-local
#
# llama.cpp serve un solo modello e ignora il campo `model`, quindi un id segnaposto va bene.

model_list:
  - model_name: claude-3-5-sonnet-20241022
    litellm_params:
      model: openai/local-mistral
      api_base: http://localhost:8080/v1
      api_key: "sk-noop"

  - model_name: claude-sonnet-4-5
    litellm_params:
      model: openai/local-mistral
      api_base: http://localhost:8080/v1
      api_key: "sk-noop"

  - model_name: claude-3-haiku-20240307
    litellm_params:
      model: openai/local-mistral
      api_base: http://localhost:8080/v1
      api_key: "sk-noop"

litellm_settings:
  drop_params: true
  success_callback: []
  failure_callback: []

general_settings:
  master_key: "sk-brainiac-local"
  port: 4000
  num_workers: 1
